<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Link Unavailable - YMV Limo</title>
</head>
<body style="margin:0;padding:0;background:#0a0f16;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center">
  <div style="max-width:420px;width:100%;margin:32px 16px;text-align:center">
    <div style="width:72px;height:72px;border-radius:50%;border:2px solid #ef4444;margin:0 auto 24px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#f87171">!</div>
    <p style="margin:0 0 8px;font-size:20px;font-weight:700;color:#f3f4f6">YMV <span style="color:#c5a059">Limo</span></p>
    <span style="display:inline-block;background:#1e2535;border:1px solid #ef4444;border-radius:20px;padding:3px 14px;font-size:11px;font-weight:700;color:#f87171;letter-spacing:.06em;text-transform:uppercase;margin-bottom:20px">Unavailable</span>
    <h1 style="margin:0 0 12px;font-size:22px;font-weight:700;color:#f3f4f6" id="err-title">Link Unavailable</h1>
    <p style="margin:0 0 24px;font-size:15px;color:#9ca3af;line-height:1.6" id="err-msg">This link is invalid or has already expired.</p>
    <p style="font-size:11px;color:#4b5563">YMV Limo &middot; Houston, TX &middot; You may close this tab.</p>
  </div>
  <script>
    const p = new URLSearchParams(location.search)
    const t = p.get('t'), m = p.get('m')
    if (t) document.getElementById('err-title').textContent = t
    if (m) document.getElementById('err-msg').textContent = m
  </script>
</body>
</html>
