<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Driver Portal | YMV Limo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body class="bg-[#0a0e17] text-slate-100 antialiased min-h-screen">

  <!-- Minimal driver header -->
  <header class="sticky top-0 z-50 border-b border-slate-800 bg-[#0A0F16]/95 backdrop-blur">
    <div class="mx-auto flex max-w-3xl items-center justify-between px-6 py-4">
      <span class="text-lg font-black tracking-tight">
        YMV <span class="text-[#C5A059]">Limo</span>
        <span class="ml-2 rounded border border-slate-700 px-2 py-0.5 text-xs font-semibold text-slate-400" data-i18n="driver.badge">Driver</span>
      </span>
      <div class="flex items-center gap-2">
        <a id="driver-book-btn" href="/"
           class="flex items-center gap-1.5 rounded-lg border border-slate-700 px-3 py-1.5 text-xs font-medium text-slate-300 hover:border-[#C5A059] hover:text-[#C5A059] transition-colors">
          <span class="material-symbols-outlined text-sm">home</span>
          <span data-i18n="driver.book_ride">Book a Ride</span>
        </a>
        <button id="driver-signout-btn"
                class="flex items-center gap-1.5 rounded-lg border border-slate-700 px-3 py-1.5 text-xs font-medium text-slate-300 hover:border-red-500 hover:text-red-400 transition-colors">
          <span class="material-symbols-outlined text-sm">logout</span>
          <span data-i18n="common.sign_out">Sign Out</span>
        </button>
      </div>
    </div>
  </header>

  <main class="mx-auto max-w-3xl px-6 py-10 space-y-8">

    <!-- Set password screen (shown after invite link is clicked) -->
    <div id="set-password-screen" class="hidden">
      <div class="mx-auto max-w-md rounded-2xl border border-slate-800 bg-[#161C28] px-8 py-8">
        <p class="text-xs font-bold uppercase tracking-widest text-[#C5A059] mb-2" data-i18n="driver.set_password_welcome">Welcome to YMV Limo</p>
        <h1 class="text-2xl font-black text-white mb-2" data-i18n="driver.set_password_title">Set your password</h1>
        <p class="text-sm text-slate-400 mb-6" data-i18n="driver.set_password_sub">Choose a password to secure your driver account.</p>
        <div class="space-y-4">
          <div class="space-y-1.5">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-500" data-i18n="driver.set_password_label">New Password</label>
            <input id="set-password-input" type="password" placeholder="Min. 8 characters"
                   class="w-full rounded-lg border border-slate-700 bg-[#0A0F16] px-4 py-2.5 text-slate-100 focus:border-[#C5A059] focus:outline-none" />
          </div>
          <div class="space-y-1.5">
            <label class="text-xs font-bold uppercase tracking-wider text-slate-500" data-i18n="driver.set_password_confirm">Confirm Password</label>
            <input id="set-password-confirm" type="password" placeholder="Repeat password"
                   class="w-full rounded-lg border border-slate-700 bg-[#0A0F16] px-4 py-2.5 text-slate-100 focus:border-[#C5A059] focus:outline-none" />
          </div>
          <p id="set-password-error" class="hidden text-xs text-red-400"></p>
          <button id="set-password-btn"
                  class="w-full flex items-center justify-center gap-2 rounded-lg bg-[#C5A059] px-6 py-3 text-sm font-bold text-[#0A0F16] hover:bg-white transition-colors disabled:opacity-50">
            <span class="material-symbols-outlined text-base">lock</span>
            <span data-i18n="driver.set_password_btn">Save Password & Continue</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Auth / not-a-driver error -->
    <div id="driver-error" class="hidden rounded-xl border border-red-500/20 bg-red-500/10 px-6 py-8 text-center">
      <span class="material-symbols-outlined text-4xl text-red-400">block</span>
      <p id="driver-error-msg" class="mt-3 text-sm text-red-300">Access denied.</p>
    </div>

    <!-- Loading skeleton -->
    <div id="driver-loading" class="space-y-6">
      <div class="skeleton h-36 rounded-2xl"></div>
      <div class="skeleton h-48 rounded-2xl"></div>
    </div>

    <!-- Portal content (hidden until loaded) -->
    <div id="driver-content" class="hidden space-y-8">

      <!-- Greeting + availability toggle -->
      <div class="rounded-2xl border border-slate-800 bg-[#161C28] px-8 py-7">
        <p class="text-xs font-bold uppercase tracking-widest text-slate-500 mb-1">Good to see you</p>
        <h1 id="driver-name" class="text-3xl font-black text-white mb-6">—</h1>

        <p class="text-sm text-slate-400 mb-4">Are you available to accept trips today?</p>

        <div class="flex items-center gap-5">
          <!-- Toggle switch -->
          <button id="availability-toggle"
                  class="relative inline-flex h-8 w-16 shrink-0 cursor-pointer items-center rounded-full border-2 border-transparent transition-colors duration-200 focus:outline-none"
                  role="switch" aria-checked="false">
            <span id="availability-knob"
                  class="pointer-events-none inline-block h-6 w-6 rounded-full bg-white shadow-lg transition-transform duration-200 translate-x-0"></span>
          </button>
          <div>
            <p id="availability-label" class="text-base font-bold text-slate-300">—</p>
            <p id="availability-sub"   class="text-xs text-slate-500">Tap to change</p>
          </div>
        </div>

        <p id="availability-error" class="hidden mt-3 text-xs text-red-400"></p>
      </div>

      <!-- Upcoming assignments -->
      <div>
        <h2 class="mb-4 text-lg font-bold text-white flex items-center gap-2">
          <span class="material-symbols-outlined text-[#C5A059]">calendar_month</span>
          Upcoming Trips
        </h2>

        <div id="trips-loading" class="hidden space-y-3">
          <div class="skeleton h-20 rounded-xl"></div>
          <div class="skeleton h-20 rounded-xl"></div>
        </div>

        <div id="trips-empty" class="hidden rounded-xl border border-slate-800 bg-[#161C28] px-6 py-8 text-center text-sm text-slate-500">
          No upcoming trips assigned yet.
        </div>

        <div id="trips-list" class="space-y-3"></div>
      </div>

    </div>

  </main>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
